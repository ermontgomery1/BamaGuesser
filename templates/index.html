<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Real-Time University of Alabama Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" integrity="sha384-mZLF4UVrpi/QTWPA7BjNPEnkIfRFn4ZEO3Qt/HFklTJBj/gBOV8G3HcKn4NfQblz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='index.css') }}">
</head>
<body>
    <!-- Authentication Modal Overlay -->
    <div id="auth-overlay">
        <div class="auth-card">
            <h2>Join Session</h2>
            <input type="text" id="user-name-input" placeholder="Your Name" required />
            <input type="password" id="user-pass-input" placeholder="Room Password" required />
            <button onclick="submitAuth()">Enter</button>
            <div id="auth-error"></div>
        </div>
    </div>

    {% if is_host %}
    <div class="host-controls">
        <button id="toggle-btn" onclick="togglePins()">Pins: SHOWN</button>
        <button id="limit-btn" onclick="toggleOnePinLimit()">1 Pin Limit: OFF</button>
        <button id="delete-all-pins-btn" onclick="deleteAllPins()">Delete All Pins</button>
    </div>
    {% endif %}

    <!-- Timer Widget (Bottom Right on Desktop / Bottom Center on Mobile) -->
    <div class="timer-panel">
        <div id="timer-display" class="timer-display">05:00</div>
        {% if is_host %}
        <div class="timer-controls">
            <input type="number" id="timer-min-input" min="0" max="180" value="5" placeholder="Min"/>
            <input type="number" id="timer-sec-input" min="0" max="59" value="0" placeholder="Sec"/>
            <button onclick="setTimerTime()">Set</button>
            <button id="timer-start-btn" onclick="toggleStartPause()">Start</button>
            <button onclick="sendTimerAction('reset')">Reset</button>
        </div>
        {% endif %}
    </div>

    <div id="map"></div>

<script src="{{ url_for('static', filename='index.js') }}"></script>
</body>
</html>
